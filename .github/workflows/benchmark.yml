name: benchmark
on:
  workflow_dispatch:
    inputs:
      sha:
        type: string
        required: false
        description: "PR commit SHA to benchmark; leave empty for the selected ref."
      record_thresholds:
        type: boolean
        default: false
        description: "Record thresholds for review instead of checking committed thresholds."
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  benchmark:
    # Publish the companion vapor/ci commit before merging this workflow.
    uses: vapor/ci/.github/workflows/run-benchmark.yml@1c7d2de79f0f6902836c7f71064fd9d26105a7b0 # better-benchmarks
    with:
      sha: ${{ inputs.sha }}
      swift_image: swift:6.4-bookworm
      configurations: >-
        [
          {"name":"instructions","build":"uninstrumented","environment":{"BENCHMARK_MODE":"instructions"}},
          {"name":"allocations","build":"allocations","swift_flags":["--traits","AllocationCounting"],"environment":{"BENCHMARK_MODE":"allocations"}},
          {"name":"cpu","build":"uninstrumented","environment":{"BENCHMARK_MODE":"cpu"}},
          {"name":"wall-clock","build":"uninstrumented","environment":{"BENCHMARK_MODE":"wall-clock"}}
        ]
      environment: >-
        {"NIO_SINGLETON_GROUP_LOOP_COUNT":"2","NIO_SINGLETON_BLOCKING_POOL_THREAD_COUNT":"2"}
      validate_thresholds: true
      record_thresholds: ${{ inputs.record_thresholds || false }}
    secrets: inherit
