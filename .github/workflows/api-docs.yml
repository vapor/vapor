name: deploy-api-docs
on:
  push:
    branches:
      - main
      - vapor4
permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    uses: vapor/api-docs/.github/workflows/deploy.yml@43ef7f23d2e438cc30307e5977d58abe201aae5e # main
    secrets: inherit
    with:
      package: vapor
      ref: ${{ github.ref_name }}
