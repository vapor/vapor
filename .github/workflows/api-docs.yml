name: deploy-api-docs
on:
  push:
    branches:
      - main
      - vapor4
permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    uses: vapor/api-docs/.github/workflows/deploy.yml@ad2e6c90e2509b49567e835249e5d45caa6d3e6e # main
    secrets: inherit
    with:
      package: vapor
      ref: ${{ github.ref_name }}
