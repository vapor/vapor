name: deploy-api-docs
on:
  push:
    branches:
      - main
      - vapor4
permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    uses: vapor/api-docs/.github/workflows/deploy.yml@386e073c5058ef26b73f2648036df4d02aa31b1d # main
    secrets: inherit
    with:
      package: vapor
      ref: ${{ github.ref_name }}
